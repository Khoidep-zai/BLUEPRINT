id: low_light_fix
version: 1
name_vi: Sửa ảnh thiếu sáng
name_en: Low Light Fix
ownership_required: false
steps:
  - detect: { faces: true }
  - edit:   { editor: lowlight, strength: 0.5, padding: 0.0 }
  - blend:  { method: feather, radius_px: 6 }
  - qa:
      clip_ratio_max: 0.02
      delta_e_skin_max: 6.0
      identity_cosine_min: 0.90
retry: { max: 2, strength_step: -0.1, reseed: true }
prompt: { vi: prompts/low_light_fix.vi.md, en: prompts/low_light_fix.en.md }
