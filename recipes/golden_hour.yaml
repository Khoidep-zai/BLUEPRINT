id: golden_hour
version: 1
name_vi: Chân dung giờ vàng
name_en: Golden Hour Portrait
steps:
  - detect: { faces: true }
  - edit:   { provider: mock, strength: 0.4, padding: 0.0, prompt_id: golden_hour }
  - blend:  { method: feather, radius_px: 6 }
