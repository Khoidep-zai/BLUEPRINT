id: golden_hour
version: 1
name_vi: Chân dung giờ vàng
name_en: Golden Hour Portrait
ownership_required: false
steps:
  - detect: { faces: true }
  - edit:   { editor: relight, strength: 0.4, padding: 0.0 }
  - blend:  { method: feather, radius_px: 6 }
  - qa:
      identity_cosine_min: 0.90
      structure_similarity_min: 0.90
      clip_ratio_max: 0.02
retry: { max: 2, strength_step: -0.1, reseed: true }
prompt: { vi: prompts/golden_hour.vi.md, en: prompts/golden_hour.en.md }
