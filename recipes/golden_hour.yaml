      delta_e_skin_max: 4.0
      clip_ratio_max: 0.01
      identity_cosine_min: 0.88
retry: { max: 2, strength_step: -0.1, reseed: true }
prompt: { vi: prompts/golden_hour.vi.md, en: prompts/golden_hour.en.md }
