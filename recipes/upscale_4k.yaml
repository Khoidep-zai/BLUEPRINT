id: upscale_4k
version: 1
name_vi: Nâng cấp 4K
name_en: 4K Upscale
ownership_required: false
steps:
  - detect: { faces: true }
  - edit:   { editor: upscale, scale: 4.0, strength: 0.3, padding: 0.0 }
  - blend:  { method: none }
  - qa:
      identity_cosine_min: 0.95
      structure_similarity_min: 0.99
      clip_ratio_max: 0.01
retry: { max: 2, strength_step: -0.1, reseed: true }
prompt: { vi: prompts/upscale_4k.vi.md, en: prompts/upscale_4k.en.md }
