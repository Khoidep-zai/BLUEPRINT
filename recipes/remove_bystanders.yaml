id: remove_bystanders
version: 1
name_vi: Xóa người hậu cảnh
name_en: Remove Bystanders
ownership_required: false
steps:
  - detect: { persons: true }
  - edit:   { editor: bystanders, strength: 0.5, padding: 0.3 }
  - blend:  { method: feather, radius_px: 10 }
  - qa:
      person_recheck: true
      outside_mask_ssim_min: 0.98
retry: { max: 2, strength_step: -0.1, reseed: true }
prompt: { vi: prompts/remove_bystanders.vi.md, en: prompts/remove_bystanders.en.md }
